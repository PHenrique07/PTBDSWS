{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Login{% endblock %}

{% block page_content %}
<div style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #eee; border-radius: 5px; margin-top: 20px;">
    <h2>Login:</h2>
    {{ wtf.quick_form(form) }}
</div>
<br>
<p>The local date and time is {{ moment(current_time).format('LLLL') }}.</p>
<p>That was {{ moment(current_time).fromNow() }}.</p>
{% endblock %}
