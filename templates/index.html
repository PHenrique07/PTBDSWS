{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Flasky{% endblock %}

{% block page_content %}
<div class="page-header">
    <!-- Se o nome existir na sessão, exibe o nome; senão, exibe Stranger -->
    <h1>Hello, {% if name %}{{ name }}{% else %}Stranger{% endif %}!</h1>
</div>

<!-- Renderiza o formulário Flask-WTF usando o estilo default do Bootstrap -->
{{ wtf.quick_form(form) }}

{% endblock %}
