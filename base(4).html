<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Aula 040{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        p { font-size: 24px; margin: 16px 0; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* estilização da barra de navegação */
        .navbar {
            background-color: #212529;
            color: #f8f9fa;
            padding: 15px 0;
        }

        .nav-flex {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar .brand { font-weight: bold; }
        .navbar a { color: #adb5bd; text-decoration: none; }
        .navbar a:hover { color: #fff; }

        .content { padding: 30px 0; }
        h1 { font-weight: 400; }
        hr { border: none; border-top: 1px solid #dee2e6; }
    </style>

    {% block head %}{% endblock %}
</head>
<body>
    <!-- navbar -->
    <div class="navbar">
        <div class="container nav-flex">
            <span class="brand">Avaliação contínua: Aula 040</span>
            <a href="{{ url_for('hello_world') }}">Home</a>
            <a href="{{ url_for('user', name='Pedro Santos') }}">Identificação</a>
            <a href="{{ url_for('contexto_requisicao', name='Pedro Santos') }}">Contexto da requisição</a>
        </div>
    </div>

    <!-- container principal -->
    <div class="content container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
